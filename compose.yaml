networks:
  vpn_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

services:
  nordvpn:
    build: .
    container_name: nordvpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - NORDVPN_TOKEN=${NORDVPN_TOKEN}
      - NORDVPN_TECHNOLOGY=${NORDVPN_TECHNOLOGY:-NordLynx}
      - NORDVPN_PROTOCOL=${NORDVPN_PROTOCOL:-udp}
      - NORDVPN_GROUP=${NORDVPN_GROUP:-p2p}
      - NORDVPN_COUNTRY=${NORDVPN_COUNTRY:-}
      - NORDVPN_SERVER=${NORDVPN_SERVER:-}
      - NORDVPN_KILLSWITCH=${NORDVPN_KILLSWITCH:-on}
      - NORDVPN_THREAT_PROTECTION_LITE=${NORDVPN_THREAT_PROTECTION_LITE:-off}
      - NORDVPN_OBFUSCATE=${NORDVPN_OBFUSCATE:-off}
      - NORDVPN_MESHNET=${NORDVPN_MESHNET:-off}
      - NORDVPN_ANALYTICS=${NORDVPN_ANALYTICS:-off}
      - NORDVPN_NOTIFY=${NORDVPN_NOTIFY:-off}
      - NORDVPN_AUTOCONNECT_STATE=${NORDVPN_AUTOCONNECT_STATE:-off}
      - NORDVPN_AUTOCONNECT_TARGET=${NORDVPN_AUTOCONNECT_TARGET:-}
      - NORDVPN_LAN_DISCOVERY=${NORDVPN_LAN_DISCOVERY:-disable}
      - NORDVPN_DNS=${NORDVPN_DNS:-}
      - NORDVPN_ALLOWLIST_PORTS=${NORDVPN_ALLOWLIST_PORTS:-}
      - NORDVPN_ALLOWLIST_SUBNETS=${NORDVPN_ALLOWLIST_SUBNETS:-}
      - NORDVPN_CONNECT=${NORDVPN_CONNECT:-}
      - NORDVPN_SKIP_CONNECT=${NORDVPN_SKIP_CONNECT:-false}
    volumes:
      - ./data/nordvpn:/etc/nordvpn
      - ./data/logs:/var/log/nordvpn
    networks:
      - vpn_network
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nordvpn", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    stop_grace_period: 15s
    ports:
      - "6881:6881" # bittorrent
      - "6881:6881/udp" # bittorrent UDP
    labels:
      - "traefik.enable=false"

  # Traefik reverse proxy - maps service names to their ports
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    ports:
      - "80:80"     # HTTP entrypoint
      - "8081:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - vpn_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.local`)"
      - "traefik.http.routers.dashboard.service=api@internal"

  # Example service: qBittorrent Web UI
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - WEBUI_PORT=8080
    volumes:
      - ./data/qbittorrent/config:/config
      - ./data/qbittorrent/downloads:/downloads
    network_mode: "service:nordvpn"
    depends_on:
      - nordvpn
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.local`)"
      - "traefik.http.routers.qbittorrent.entrypoints=web"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"

  # Example service: Prowlarr (indexer manager)
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ./data/prowlarr:/config
    network_mode: "service:nordvpn"
    depends_on:
      - nordvpn
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.local`)"
      - "traefik.http.routers.prowlarr.entrypoints=web"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"

  # Example service: Radarr (movie manager)
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ./data/radarr:/config
      - ./data/qbittorrent/downloads:/downloads
    network_mode: "service:nordvpn"
    depends_on:
      - nordvpn
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.local`)"
      - "traefik.http.routers.radarr.entrypoints=web"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"

  # Example service: Sonarr (TV shows manager)
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ./data/sonarr:/config
      - ./data/qbittorrent/downloads:/downloads
    network_mode: "service:nordvpn"
    depends_on:
      - nordvpn
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.local`)"
      - "traefik.http.routers.sonarr.entrypoints=web"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
